:root{--pink:#E8839B;--pink2:#F4A7B9;--blush:#FCE4EA;--sage:#8FAA92;--sagedk:#6E8A76;--sagelt:#E6EEE5;--cream:#FBF7F2;--ink:#4E5F55;--muted:#8A968E;--line:#EDE6DF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F3EEE8;color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
button,input,textarea{font-family:inherit;color:inherit}

/* ---------- App layout ---------- */
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.panel{background:#fff;border-right:1px solid var(--line);padding:22px 22px 120px;height:100vh;overflow-y:auto;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{width:48px;height:48px}
.brand h1{font-family:'Quicksand';font-weight:700;font-size:20px;color:var(--pink);line-height:1.1}
.brand p{font-size:12px;color:var(--muted)}
.sec{margin-top:18px}
.sec h2{font-family:'Quicksand';font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sagedk);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:var(--cream);outline:none;transition:border-color .15s}
label.f input:focus,label.f textarea:focus{border-color:var(--pink2);background:#fff}
label.f textarea{resize:vertical;min-height:64px;line-height:1.45}
.stack>*+*{margin-top:10px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:78px 1fr;gap:12px;position:relative;background:#fff}
.item+.item{margin-top:10px}
.pic{width:78px;height:78px;border-radius:10px;border:1.5px dashed var(--pink2);background:var(--blush) center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--pink);text-align:center;font-weight:700;line-height:1.2}
.pic.has{border-style:solid;border-color:transparent;color:transparent}
.pic input{display:none}
.item .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item .fields .full{grid-column:1/-1}
.item .fields input{padding:7px 9px;font-size:13.5px}
.item .sub{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.item .sub b{color:var(--sagedk);font-size:14px}
.del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--pink);background:var(--blush)}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .05s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn.add{width:100%;margin-top:10px;background:var(--sagelt);color:var(--sagedk)}
.btn.add:hover{filter:brightness(.97)}
.actions{position:fixed;left:0;bottom:0;width:420px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;z-index:5}
.btn.pdf{flex:1;background:var(--pink);color:#fff;font-family:'Quicksand';font-size:15px}
.btn.pdf:hover{filter:brightness(1.05)}
.btn.new{background:var(--cream);color:var(--ink);border:1.5px solid var(--line)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.stage{padding:28px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.scaler{transform-origin:top center}

/* ---------- Calculadora 3D ---------- */
details.cfg{margin-top:18px;border:1.5px solid var(--line);border-radius:14px;background:var(--cream)}
details.cfg summary{list-style:none;cursor:pointer;padding:11px 14px;font-family:'Quicksand';font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sagedk);display:flex;justify-content:space-between;align-items:center}
details.cfg summary::-webkit-details-marker{display:none}
details.cfg summary:after{content:'+';font-size:18px;color:var(--pink)} details.cfg[open] summary:after{content:'–'}
details.cfg .in{padding:0 14px 14px}
details.cfg label.f input,details.cfg label.f select{background:#fff}
label.f select{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:var(--cream);font-family:inherit;color:inherit}
.calct{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--sagedk);cursor:pointer;user-select:none}
.calct input{accent-color:var(--pink);width:16px;height:16px}
.calcbox{grid-column:1/-1;background:var(--cream);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calcbox label.f input{padding:7px 9px;font-size:13.5px;background:#fff}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .lbl{font-size:12px;font-weight:600;color:var(--muted);width:100%}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chips input{width:62px;border:1.5px solid var(--line);border-radius:9px;padding:5px 7px;font-size:12.5px;background:#fff}
.bd{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.bd div{display:flex;justify-content:space-between;padding:1.5px 0}
.bd .t{color:var(--ink);font-weight:700}
.bd .p{color:var(--pink);font-weight:800;font-size:13.5px}
.item .fields input[disabled]{background:var(--blush);color:var(--pink);font-weight:800;border-color:transparent}

/* ---------- Quote page (A4) ---------- */
.page{width:210mm;min-height:297mm;background:var(--cream);position:relative;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(78,95,85,.15);border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.frame{position:absolute;inset:9mm;border:2px solid var(--blush);border-radius:18px;pointer-events:none}
.wrap{position:relative;padding:8mm 9mm 0;flex:1;margin:9mm;border:2px solid var(--blush);border-radius:18px;display:flex;flex-direction:column;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.q-head{display:flex;align-items:center;justify-content:space-between}
.q-logo{width:38mm;height:38mm}
.q-doc{text-align:right}
.q-doc h1{font-family:'Quicksand';font-weight:700;color:var(--pink);font-size:34pt;letter-spacing:1px;line-height:1}
.q-doc .sub{font-family:'Quicksand';font-weight:600;color:var(--sagedk);font-size:11pt;margin-top:4px}
.meta{display:inline-grid;grid-template-columns:auto auto;gap:3px 14px;margin-top:12px;font-size:9.5pt;text-align:left}
.meta b{color:var(--sagedk);font-weight:700}
.card{margin-top:7mm;background:#fff;border-radius:14px;padding:5mm 6mm}
.lab{font-family:'Quicksand';font-weight:700;font-size:8pt;letter-spacing:2px;color:var(--pink);text-transform:uppercase}
.card .name{font-family:'Quicksand';font-weight:700;font-size:14pt;margin-top:2px}
.card .line{font-size:9pt;color:var(--muted);margin-top:4px}
.card .line b{color:var(--ink);font-weight:600}
.intro{margin:6mm 1mm 0}
.intro .ih{font-family:'Quicksand';font-weight:700;color:var(--pink);font-size:11pt;margin-bottom:2px}
.intro p{font-size:10pt;line-height:1.55;white-space:pre-line}
table.q{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:10.5pt;margin-top:5mm}
table.q th{font-family:'Quicksand';font-weight:700;font-size:8.5pt;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--sage);padding:9px 12px;text-align:left}
table.q th:first-child{border-radius:12px 0 0 12px} table.q th:last-child{border-radius:0 12px 12px 0}
table.q td{background:#fff;padding:11px 12px;vertical-align:middle}
table.q td:first-child{border-radius:12px 0 0 12px;padding:7px 12px 7px 7px} table.q td:last-child{border-radius:0 12px 12px 0}
table.q tr{break-inside:avoid;page-break-inside:avoid}
.c{text-align:center!important} .r{text-align:right!important}
.s{font-weight:800;color:var(--sagedk)}
.prod{display:flex;align-items:center;gap:12px}
.prod .ph{width:18mm;height:18mm;border-radius:10px;background:var(--blush) center/cover no-repeat;flex:none}
.prod .ph.none{display:flex;align-items:center;justify-content:center}
.pn{font-family:'Quicksand';font-weight:700;font-size:11pt}
.empty{text-align:center;color:var(--muted);font-size:10pt;padding:10mm 0!important;border-radius:12px!important}
.sum{display:flex;justify-content:flex-end;margin-top:2mm;break-inside:avoid}
.box{width:88mm}
.srow{display:flex;justify-content:space-between;font-size:10pt;padding:4px 14px}
.tot{margin-top:6px;background:var(--pink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.tot span{font-family:'Quicksand';font-weight:700;font-size:11pt;letter-spacing:2px}
.tot b{font-family:'Quicksand';font-weight:700;font-size:21pt}
.cond{margin-top:6mm;background:var(--sagelt);border-radius:14px;padding:4mm 7mm;break-inside:avoid}
.cond h3{font-family:'Quicksand';font-weight:700;color:var(--sagedk);font-size:11pt;margin-bottom:6px}
.cond ul{list-style:none;font-size:9.3pt;line-height:1.6}
.cond li:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink2);margin-right:9px;vertical-align:1px}
.q-foot{text-align:center;padding:8mm 0 6mm;margin-top:auto;break-inside:avoid}
.thanks{font-family:'Quicksand';font-weight:700;color:var(--pink);font-size:15pt;display:flex;align-items:center;justify-content:center;gap:8px}
.tag{font-family:'Quicksand';font-weight:600;color:var(--sagedk);font-size:9.5pt;margin-top:4px;letter-spacing:.5px}
.dash{display:inline-block;width:10px;height:4px;border-radius:3px;margin:0 3px;vertical-align:middle}

/* ---------- Mobile ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .panel{height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:18px 16px 24px}
  .actions{width:100%;padding:10px 16px}
  .stage{padding:16px 16px 100px}
}

/* ---------- Print ---------- */
@page{size:A4;margin:0}
@media print{
  html,body{background:var(--cream)!important}
  .wrap{margin-bottom:9mm}
  .panel,.actions{display:none!important}
  .app{display:block}
  .stage{padding:0;display:block}
  .scaler{transform:none!important;height:auto!important}
  .page{box-shadow:none;border-radius:0;width:210mm}
}
</style>
</head>

      <div><h1>Presupuestos</h1><p>Estudio Hojita</p></div>
    </div>

    <div class="sec">
      <h2>Datos</h2>
      <div class="grid2">
        <label class="f">Fecha<input id="fecha" type="date"></label>
        <label class="f">Validez (días)<input id="validez" type="number" min="1"></label>
      </div>
    </div>

    <div class="sec">
      <h2>Cliente <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)">(opcional)</span></h2>
      <div class="grid2">
        <label class="f">Nombre / empresa<input id="cliente" placeholder="Ej: Psico en red"></label>
        <label class="f">Contacto<input id="contacto" placeholder="Ej: María José"></label>
      </div>
    </div>


    <details class="cfg" id="cfgbox">
      <summary>Costos de impresión 3D</summary>
      <div class="in">
        <div class="grid2">
          <label class="f">Filamento ($/kg)<input data-c="fil" type="number" min="0"></label>
          <label class="f">Precio kWh ($)<input data-c="kwh" type="number" min="0"></label>
          <label class="f">Consumo impresora (W)<input data-c="w" type="number" min="0"></label>
          <label class="f">Vida útil máquina (h)<input data-c="vida" type="number" min="0"></label>
          <label class="f">Costo repuestos ($)<input data-c="rep" type="number" min="0"></label>
          <label class="f">Margen de error (%)<input data-c="err" type="number" min="0"></label>
          <label class="f">Recargo insumos (%)<input data-c="recIns" type="number" min="0"></label>
          <label class="f">Recargo MercadoLibre (%)<input data-c="recML" type="number" min="0"></label>
          <label class="f" style="grid-column:1/-1">Redondear precio hacia arriba a
            <select data-c="red"><option value="0">Sin redondeo</option><option value="10">$ 10</option><option value="50">$ 50</option><option value="100">$ 100</option><option value="500">$ 500</option></select></label>
        </div>
        <p class="hint">Se usan en los productos que tengan activado "Calcular precio". Nada de esto aparece en el PDF.</p>
      </div>
    </details>

    <div class="sec">
      <h2>Productos</h2>
      <div id="items"></div>
      <button class="btn add" id="add">+ Agregar producto</button>
    </div>

    <div class="sec">
      <h2>Textos</h2>
      <div class="stack">
        <label class="f">Propuesta (opcional)<textarea id="propuesta" placeholder="Ej: Para esta acción proponemos un kit de 90 piezas personalizadas…"></textarea></label>
        <label class="f">Condiciones (una por línea)<textarea id="condiciones" rows="4"></textarea></label>
      </div>
      <p class="hint">Todo se guarda solo en este navegador. En la ventana de impresión elegí "Guardar como PDF".</p>
    </div>
  </aside>

  <main class="stage"><div class="scaler" id="scaler"><div class="page" id="page"></div></div></main>
</div>

<div class="actions">
  <button class="btn new" id="nuevo" title="Empezar un presupuesto nuevo">Nuevo</button>
  <button class="btn pdf" id="pdf">Descargar PDF</button>
</div>

const longDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"}) };
const addDays = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d+Number(n||0)); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0") };
const num = v => { const n=parseFloat(String(v).replace(/\./g,"").replace(",",".")); return isNaN(n)?0:n };

}

function save(){
  if(!store.set(KEY, JSON.stringify(state))){

    store.set(KEY, JSON.stringify({...state, items:state.items.map(i=>({...i,img:""}))}));

}


/* ---------- Calculadora 3D (costos) ---------- */
const KEYC = "hojita-costos-3d-v1";
const DEF_CFG = {fil:25000, kwh:315, w:150, vida:4320, rep:150000, err:5, recIns:30, recML:16, red:100};
let cfg; try{ cfg = {...DEF_CFG, ...(JSON.parse(store.get(KEYC))||{})} }catch(e){ cfg = {...DEF_CFG} }
const dec = v => { const n=parseFloat(String(v??"").replace(",",".")); return isNaN(n)?0:n };
const MULTS = [["2","Alto volumen / descuento"],["2.5","Volumen medio"],["3","Mayorista"],["3.5","Intermedio"],["4","Minorista"],["5","Llaveros / piezas chicas"]];
const blankCalc = () => ({on:false,h:"",m:"",g:"",ins:"",mult:"4"});
function calc(k){
  const hrs = dec(k.h) + dec(k.m)/60;
  const material = dec(k.g)/1000 * dec(cfg.fil);
  const luz = dec(cfg.w)/1000 * hrs * dec(cfg.kwh);
  const desgaste = dec(cfg.vida)>0 ? dec(cfg.rep)/dec(cfg.vida) * hrs : 0;
  const error = (material+luz+desgaste) * dec(cfg.err)/100;
  const costo = material+luz+desgaste+error;
  const insumos = dec(k.ins) * (1 + dec(cfg.recIns)/100);
  const mult = dec(k.mult);
  const total = costo*mult + insumos;
  const ml = costo*mult*(1 + dec(cfg.recML)/100) + insumos;
  const r = dec(cfg.red);
  const precio = r>0 ? Math.ceil(total/r - 1e-9)*r : Math.round(total);
  return {material,luz,desgaste,error,costo,insumos,mult,total,ml,precio};
}
const money2 = v => "$ " + new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
function applyCalc(it){ if(it.calc && it.calc.on){ it.precio = String(calc(it.calc).precio) } }
document.querySelectorAll("[data-c]").forEach(el=>{
  el.value = cfg[el.dataset.c];
  el.addEventListener("input",()=>{
    cfg[el.dataset.c] = el.value; store.set(KEYC, JSON.stringify(cfg));
    state.items.forEach(applyCalc); save(); renderItems(); render();
  });
});

          <input data-q="mult" type="number" step="0.1" min="0" value="${esc(it.calc.mult)}" title="Multiplicador personalizado (ej: 2,8)">
        </div>
        <div class="bd" data-bd></div>
      </div>`:''}
      <div class="sub"><span>Subtotal <b data-sub>${money(num(it.precio)*num(it.cantidad))}</b></span>
        <button class="del" title="Quitar producto">Quitar</button></div>`;
    el.querySelectorAll("input[data-k]").forEach(inp=>inp.addEventListener("input",e=>{
      it[e.target.dataset.k]=e.target.value;
      el.querySelector("[data-sub]").textContent=money(num(it.precio)*num(it.cantidad));
      save(); render();
    }));
    const refresh = () => {
      applyCalc(it);
      const pi = el.querySelector("[data-k=precio]"); if(it.calc.on) pi.value = it.precio;
      el.querySelector("[data-sub]").textContent = money(num(it.precio)*num(it.cantidad));
      const bd = el.querySelector("[data-bd]");
      if(bd){ const r = calc(it.calc);
        bd.innerHTML = `<div><span>Material</span><span>${money2(r.material)}</span></div>
          <div><span>Luz</span><span>${money2(r.luz)}</span></div>
          <div><span>Desgaste máquina</span><span>${money2(r.desgaste)}</span></div>
          <div><span>Margen de error</span><span>${money2(r.error)}</span></div>
          <div class="t"><span>Costo total (sin insumos)</span><span>${money2(r.costo)}</span></div>
          <div><span>Insumos (+${dec(cfg.recIns)}%)</span><span>${money2(r.insumos)}</span></div>
          <div class="t"><span>Total a cobrar</span><span>${money2(r.total)}</span></div>
          <div><span>Precio MercadoLibre</span><span>${money2(r.ml)}</span></div>
          <div class="p"><span>Precio unitario${dec(cfg.red)>0?' (redondeado)':''}</span><span>${money(r.precio)}</span></div>`; }
    };
    el.querySelector("[data-calc-on]").addEventListener("change",e=>{
      it.calc.on = e.target.checked; applyCalc(it); save(); renderItems(); render();
    });
    el.querySelectorAll("[data-q]").forEach(inp=>inp.addEventListener("input",e=>{
      it.calc[e.target.dataset.q] = e.target.value;
      if(e.target.dataset.q==="mult") el.querySelectorAll("[data-mult]").forEach(b=>b.classList.toggle("on", dec(b.dataset.mult)===dec(e.target.value)));
      refresh(); save(); render();
    }));
    el.querySelectorAll("[data-mult]").forEach(b=>b.addEventListener("click",()=>{
      it.calc.mult = b.dataset.mult; el.querySelector("[data-q=mult]").value = b.dataset.mult;
      el.querySelectorAll("[data-mult]").forEach(x=>x.classList.toggle("on", x===b));
      refresh(); save(); render();
    }));
    refresh();
    el.querySelector("input[type=file]").addEventListener("change",async e=>{
      const f=e.target.files[0]; if(!f) return;
      it.img = await shrink(f, 500); save(); renderItems(); render();
    });
    el.querySelector(".del").addEventListener("click",()=>{
      state.items.splice(i,1); if(!state.items.length) state.items.push(blankItem());
      save(); renderItems(); render();
    });
    box.appendChild(el);
  });
}
$("add").addEventListener("click",()=>{ state.items.push(blankItem()); save(); renderItems(); render();

// Recorta la foto en cuadrado y la achica para que el PDF quede liviano
function shrink(file, size){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const s=Math.min(im.width,im.height), c=document.createElement("canvas"); c.width=c.height=size;
      c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);
      res(c.toDataURL("image/jpeg",0.85)) }; im.src=r.result };
    r.readAsDataURL(file);
  });
}

  const rows = items.length ? items.map(i=>`
    <tr><td><div class="prod">${i.img?`<div class="ph" style="background-image:url('${i.img}')"></div>`:`<div class="ph none">${heart(18,"#F4A7B9")}</div>`}<div class="pn">${esc(i.nombre)||"&nbsp;"}</div></div></td>
    <td class="c">${num(i.cantidad)||""}</td><td class="r">${money(num(i.precio))}</td><td class="r s">${money(num(i.precio)*num(i.cantidad))}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">Agregá productos en el formulario para verlos acá</td></tr>`;
  $("page").innerHTML = `
        <div class="wrap">
      <div class="q-head">
        <img class="q-logo" src="${LOGO}" alt="Estudio Hojita">
        <div class="q-doc"><h1>Presupuesto</h1><div class="sub">Estudio Hojita</div>
          <div class="meta"><b>Fecha</b><span>${longDate(state.fecha)}</span>
          ${state.fecha&&state.validez?`<b>Válido hasta</b><span>${longDate(addDays(state.fecha,state.validez))}</span>`:""}</div></div>
      </div>
      ${state.cliente||state.contacto?`<div class="card"><div class="lab">Para</div><div class="name">${esc(state.cliente)}</div>
        ${state.contacto?`<div class="line">Contacto: <b>${esc(state.contacto)}</b></div>`:""}</div>`:""}
      ${state.propuesta?`<div class="intro"><div class="ih">Nuestra propuesta</div><p>${esc(state.propuesta)}</p></div>`:""}
      <table class="q"><thead><tr><th>Producto</th><th class="c">Cantidad</th><th class="r">Precio unitario</th><th class="r">Subtotal</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sum"><div class="box">
        <div class="srow"><span>Unidades totales</span><b>${units}</b></div>
        <div class="tot"><span>TOTAL</span><b>${money(total)}</b></div>
      </div></div>
      ${conds.length?`<div class="cond"><h3>Condiciones</h3><ul>${conds.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`:""}
    <div class="q-foot">
      <div class="thanks">${heart(14)} ¡Gracias por elegirnos! ${heart(14)}</div>
      <div class="tag"><span class="dash" style="background:#F4A7B9"></span><span class="dash" style="background:#8FAA92"></span>&nbsp; Objetos bonitos para la vida cotidiana &nbsp;<span class="dash" style="background:#8FAA92"></span><span class="dash" style="background:#F4A7B9"></span></div>
    </div></div>`;
  fit();
}

// Escala la hoja A4 para que entre en la pantalla (celular incluido)
function fit(){
  const sc=$("scaler"), page=$("page"), stage=sc.parentElement;
  const avail = stage.clientWidth - (window.innerWidth<=900?32:56);
  const k = Math.min(1, avail / page.offsetWidth);
  sc.style.transform = `scale(${k})`;
  sc.style.height = (page.offsetHeight*k)+"px";
}
window.addEventListener("resize",fit);

/* ---------- Actions ---------- */
$("pdf").addEventListener("click",()=>{
  const old=document.title;
  document.title = `Presupuesto${state.cliente?" - "+state.cliente:""} - Estudio Hojita`;
  window.print();
  setTimeout(()=>document.title=old, 500);
});
$("nuevo").addEventListener("click",()=>{
  if(!confirmNew()) return;
  const keep = {propuesta:"", condiciones:state.condiciones||DEF_COND, validez:state.validez||15};
  state = {...fresh(), ...keep};
  save(); fillForm(); render(); window.scrollTo({top:0,behavior:"smooth"});
});
function confirmNew(){
  const hasData = state.items.some(i=>i.nombre||i.precio||i.img);
  if(!hasData) return true;
  const b=$("nuevo");
  if(b.dataset.armed){ delete b.dataset.armed; b.textContent="Nuevo"; return true }
  b.dataset.armed="1"; b.textContent="¿Seguro?";
  setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent="Nuevo" } },3000);
  return false;
}

fillForm(); render();
document.fonts && document.fonts.ready.then(fit);
</script>
</body>
</html>
